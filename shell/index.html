<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>学习台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f7f8f'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E5%AD%A6%3C/text%3E%3C/svg%3E">
<script>try{var t=JSON.parse(localStorage.getItem('hub:theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="hub.css">
</head>
<body>
<header id="top" class="top">
  <button id="menu" class="ib" type="button" aria-label="打开目录" aria-expanded="false" aria-controls="side">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/">学习台</a>
  <span id="crumb" class="crumb" hidden></span>
  <div class="tools">
    <button id="theme" class="ib" type="button" aria-label="主题：自动"></button>
  </div>
  <div id="prog" class="prog" aria-hidden="true"></div>
</header>

<aside id="side" class="side" aria-label="选书"></aside>
<div id="scrim" class="scrim"></div>

<main id="view" class="view"></main>
<iframe id="book" class="book" title="正在阅读的书" hidden allow="autoplay; fullscreen"></iframe>
<div id="dock" class="dock" hidden></div>

<script src="hub.js"></script>
</body>
</html>
