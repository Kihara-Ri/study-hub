<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>零起点现代标准阿拉伯语 · 互动学习台</title>
<link rel="stylesheet" href="assets/style.css">
<style>.icon-btn.backhome{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;width:auto;height:34px;padding:0 12px;gap:6px;text-decoration:none;font-size:13px;color:var(--ink2,#6b6157);white-space:nowrap;flex:none}.icon-btn.backhome:hover{border-color:var(--pink,#e0457b);color:var(--pink,#e0457b)}.icon-btn.backhome svg{width:15px;height:15px;flex:none;display:block}@media(max-width:560px){.icon-btn.backhome span{display:none}.icon-btn.backhome{padding:0 9px}}</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1>阿拉伯语<span>入门</span>学习台</h1>
      <p>现代标准阿拉伯语 · 零基础自学</p>
    </div>
    <div class="side-search">
      <input id="searchInput" type="search" placeholder="搜索阿语 / 中文 / 转写…" autocomplete="off">
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <a class="icon-btn" href="../about.html" title="关于内容来源"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.9" r="0.95" fill="currentColor" stroke="none"/></svg></a>
      <a class="icon-btn" href="讲义.html" target="_blank" rel="noopener" title="结构化讲义（可打印）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 4.8 7.5 4 4.5 4v14c3 0 5.5.8 7.5 2.5 2-1.7 4.5-2.5 7.5-2.5V4c-3 0-5.5.8-7.5 2.5z"/><path d="M12 6.5V20"/></svg></a>
      <a class="icon-btn" href="学习计划.html" target="_blank" rel="noopener" title="12 周学习计划"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7.5 14h2M11 14h2M14.5 14h2M7.5 17.5h2M11 17.5h2"/></svg></a>
      <button class="icon-btn" id="themeBtn" title="切换深色/浅色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg></button>
      <button class="icon-btn" id="helpBtn" title="快捷键与说明"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.9"/><circle cx="12" cy="17.3" r=".9" fill="currentColor" stroke="none"/></svg></button>
      <button class="icon-btn" id="exportBtn" title="导出学习数据"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M4 20h16"/></svg></button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <a class="icon-btn backhome" href="../index.html" title="返回选书"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg><span>选书</span></a>
      <button class="icon-btn" id="hamburger" title="菜单">☰</button>
      <div class="crumb" id="crumb">学习台</div>
      <div class="spacer"></div>
      <div id="topActions"></div>
    </div>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="toast"></div>
<audio id="player"></audio>

<script src="assets/data.js"></script>
<script src="assets/srs.js"></script>
<script src="assets/quiz.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
