<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>影子跟读 · 中级日语口语</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">影子<span>跟読</span></a>
  <nav>
    <a href="../index.html">选书</a>
    <a href="#/" data-nav="home">场景</a>
    <a href="#/expr" data-nav="expr">表达库</a>
  </nav>
</header>
<main id="app" aria-live="polite"></main>
<div id="bar" class="bar" hidden>
  <div class="bar-now"><b id="barLine">–</b><small id="barTime"></small></div>
  <div class="bar-ctl">
    <button id="bPrev" aria-label="上一句">⏮</button>
    <button id="bPlay" class="main" aria-label="播放/暂停">▶</button>
    <button id="bNext" aria-label="下一句">⏭</button>
    <div class="seg" id="modeSeg" role="group" aria-label="播放模式">
      <button data-mode="flow" title="连续播放">连续</button>
      <button data-mode="one" title="播完当前句停下">单句</button>
      <button data-mode="loop" title="单句循环">循环</button>
      <button data-mode="shadow" title="播完停顿一个句长，留给你跟读">跟读</button>
    </div>
    <select id="rate" aria-label="语速">
      <option value="0.7">0.7×</option><option value="0.85">0.85×</option>
      <option value="1" selected>1×</option><option value="1.15">1.15×</option>
    </select>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
