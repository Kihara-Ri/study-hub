<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>零起点标准法语 · 互动学习台</title>
<link rel="stylesheet" href="assets/style.css">
<style>.icon-btn.backhome{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;width:auto;height:34px;padding:0 12px;gap:6px;text-decoration:none;font-size:13px;color:var(--ink2,#6b6157);white-space:nowrap;flex:none}.icon-btn.backhome:hover{border-color:var(--pink,#e0457b);color:var(--pink,#e0457b)}.icon-btn.backhome svg{width:15px;height:15px;flex:none;display:block}@media(max-width:560px){.icon-btn.backhome span{display:none}.icon-btn.backhome{padding:0 9px}}</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1>法语<span>入门</span>学习台</h1>
      <p>零起点标准法语 · 24 节 · 全配音</p>
    </div>
    <div class="side-search">
      <input id="searchInput" type="search" placeholder="搜索法语 / 中文 / 音标…" autocomplete="off">
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <a class="icon-btn" href="../about.html" title="关于内容来源"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.9" r="0.95" fill="currentColor" stroke="none"/></svg></a>
      <button class="icon-btn" id="themeBtn" title="切换深色/浅色">◐</button>
      <button class="icon-btn" id="helpBtn" title="快捷键与说明">?</button>
      <button class="icon-btn" id="exportBtn" title="导出学习数据">⤓</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <a class="icon-btn backhome" href="../index.html" title="返回选书"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg><span>选书</span></a>
      <button class="icon-btn" id="hamburger" title="菜单">☰</button>
      <div class="crumb" id="crumb">学习台</div>
      <div class="spacer"></div>
      <div id="topActions"></div>
    </div>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="toast"></div>
<audio id="player"></audio>

<script src="assets/data.js"></script>
<script src="assets/srs.js"></script>
<script src="assets/quiz.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
